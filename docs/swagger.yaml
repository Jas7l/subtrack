        sheet, by payment date (newest first; `order=asc`: oldest first).'
      parameters:
      - description: Only this subscription
        in: query
        name: subscription_id
        type: integer
      - description: pending | paid | failed
        in: query
        name: status
        type: string
      - description: payment_date from, inclusive (YYYY-MM-DD)
