      email:
        example: petrov@company.ru
        type: string
      full_name:
        example: Петров Пётр Петрович
        type: string
      password:
        example: initial-password
        type: string
      role:
        enum:
        - admin
        - manager
        - employee
        example: employee
        type: string
    type: object
  user.ListUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/user.UserDTO'
        type: array
      limit:
        example: 50
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 123
        type: integer
    type: object
  user.SetPasswordRequest:
    properties:
      password:
        example: temporary-password
        type: string
    type: object
  user.UpdateUserRequest:
    properties:
      department_id:
        example: 3
        type: integer
        x-nullable: true
      email:
        example: petrov@company.ru
        type: string
      full_name:
        example: Петров Пётр Петрович
        type: string
      is_active:
        example: false
        type: boolean
      role:
        enum:
        - admin
        - manager
        - employee
        example: manager
        type: string
    type: object
  user.UserDTO:
    properties:
      created_at:
        example: "2026-10-21T10:00:00Z"
        type: string
      department_id:
        example: 3
        type: integer
      email:
        example: petrov@company.ru
        type: string
      full_name:
        example: Петров Пётр Петрович
        type: string
      id:
        example: 7
        type: integer
      is_active:
        example: true
        type: boolean
      role:
        enum:
        - admin
        - manager
        - employee
        example: employee
        type: string
      updated_at:
        example: "2026-10-21T10:00:00Z"
        type: string
    type: object
info:
  contact: {}
  description: |-
    Учёт корпоративных подписок на ПО: реестр подписок и лицензий, заявки с согласованием (сотрудник → начальник отдела → админ), платежи, уведомления, аудит, аналитика и рекомендации по экономии.
    Успешный ответ — сам объект (списки — `items` и `total`/`limit`/`offset`), без обёртки; ошибка — JSON с полем `description`. Суть результата передаёт HTTP-статус.
    Вход: `POST /auth/login`, затем кнопка Authorize и значение `Bearer <token>`.
  title: SubTrack API
  version: "1.0"
paths:
  /analytics/by-category:
    get:
      description: Active subscriptions grouped by category (case-insensitively),
        most expensive first, with their share. A head gets their own department.
      parameters:
      - description: 'Admin: one department'
        in: query
        name: department_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.BreakdownResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Monthly cost by category (admin, department head)
      tags:
      - analytics
  /analytics/by-department:
    get:
      description: Every department with its active subscriptions' monthly cost, seats,
        active users and cost per user, most expensive first; department_id null holds
        the company-wide subscriptions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.ByDepartmentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Departments compared (admin)
      tags:
      - analytics
  /analytics/by-vendor:
    get:
      description: Active subscriptions grouped by vendor (case-insensitively), most
        expensive first, with their share. A head gets their own department.
      parameters:
      - description: 'Admin: one department'
        in: query
        name: department_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.BreakdownResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Monthly cost by vendor (admin, department head)
      tags:
      - analytics
  /analytics/export:
    get:
      description: 'One workbook: summary, cost by category, by vendor and (for the
        whole company) by department, the 20 most expensive subscriptions, paid by
        month for the last 12 months, a 12-month forecast, the recommendations and
        the currency rates every rouble amount was converted at.'
      parameters:
      - description: One department
        in: query
        name: department_id
        type: integer
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Export the analytics to Excel (admin)
      tags:
      - analytics
  /analytics/forecast:
    get:
      description: 'Expected spending of the active subscriptions, month by month
        from this one: payments by next_payment_date and billing period up to the
        end date, plus the monthly cost of subscriptions without a next_payment_date
        (estimated). run_rate_rub is the cost if everything were renewed. A head gets
        their own department.'
      parameters:
      - description: 'Admin: one department'
        in: query
        name: department_id
        type: integer
      - description: How many months (default 12, max 36)
        in: query
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.ForecastResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Budget forecast (admin, department head)
      tags:
      - analytics
  /analytics/recommendations:
    get:
      description: 'Advice from the rules: unused seats, nobody using a subscription,
        several subscriptions of one vendor, individual copies of one product, an
        unlimited licence used by few, monthly billing for over a year, an expired
        subscription with licences still out. Sorted by yearly saving; advice whose
        saving cannot be computed comes last with savings_rub_year null.'
      parameters:
      - description: One department
        in: query
        name: department_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.RecommendationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Savings recommendations (admin)
      tags:
      - analytics
  /analytics/spending:
    get:
      description: 'Paid payments summed by the month of their payment date, in roubles
        at the current rates; every month of the period is present. Default: the last
        12 months; at most 60.'
      parameters:
      - description: One department
        in: query
        name: department_id
        type: integer
      - description: First month, YYYY-MM
        in: query
        name: from
        type: string
      - description: 'Last month, YYYY-MM (default: this month)'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.SpendingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Paid by month (admin)
      tags:
      - analytics
  /analytics/summary:
    get:
      description: Counts, monthly and annual cost in roubles, seat usage, licences
        and cost per user. The admin may pick a department and also gets payment figures
        and the recommendations' count and savings; a head always gets their own department
        and no payment figures.
      parameters:
      - description: 'Admin: one department'
        in: query
        name: department_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.SummaryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Dashboard summary (admin, department head)
      tags:
      - analytics
  /analytics/top-subscriptions:
    get:
      description: Active subscriptions by monthly cost, with seat usage and the monthly
        cost per licence handed out.
      parameters:
      - description: One department
        in: query
        name: department_id
        type: integer
      - description: How many (default 10, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.TopResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Most expensive subscriptions (admin)
      tags:
      - analytics
  /assignments:
    get:
      description: 'Admin: all. Manager: those of their department''s subscriptions
        plus their own. Employee: their own. Newest first.'
      parameters:
      - description: Only this subscription's
        in: query
        name: subscription_id
        type: integer
      - description: Only this user's
        in: query
        name: user_id
        type: integer
      - description: Only this status
        enum:
        - active
        - revoked
        in: query
        name: status
        type: string
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscription.ListAssignmentsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List licences
      tags:
      - assignments
    post:
      consumes:
      - application/json
      description: 'Admin: any active or expiring_soon subscription to any active
        user. Manager: only their department''s subscriptions, only to people of their
        department. Takes one seat.'
      parameters:
      - description: Who gets which subscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/subscription.AssignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/subscription.AssignmentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Hand out a licence (admin, manager)
      tags:
      - assignments
  /assignments/{id}:
    get:
      description: Visible as in the list; anything else is a 404.
      parameters:
      - description: Assignment id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscription.AssignmentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a licence
      tags:
      - assignments
  /assignments/{id}/revoke:
    post:
      description: Frees the seat; the row stays as history. Allowed to the admin,
        the manager of the subscription's department, and the holder (giving it back).
      parameters:
      - description: Assignment id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscription.AssignmentDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Revoke a licence
      tags:
      - assignments
  /audit:
    get:
      description: Who changed what, newest first. actor_id null means the system.
        Actions are "<entity>.<verb>", e.g. user.update, subscription.delete, assignment.revoke,
        request.approve.
      parameters:
      - description: Only this user's actions
        in: query
        name: actor_id
        type: integer
      - description: Only this entity type
        enum:
        - user
        - department
        - subscription
        - assignment
        - request
        - transaction
        - settings
        - currency
        in: query
        name: entity_type
        type: string
      - description: Only this entity (with entity_type)
        in: query
        name: entity_id
        type: integer
      - description: Only this action
        in: query
        name: action
        type: string
      - description: From this day (YYYY-MM-DD), inclusive
        in: query
        name: from
        type: string
      - description: To this day (YYYY-MM-DD), inclusive
        in: query
        name: to
        type: string
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audit.ListAuditResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Audit trail (admin)
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Checks email and password and returns a JWT. An unknown email and
        a wrong password both answer 401 with the same message; a blocked account
        answers 403.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Sign in
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the user the bearer token belongs to.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/password:
    post:
      consumes:
      - application/json
      description: Replaces the caller's password after checking the current one.
        Issued tokens stay valid.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - auth
  /currencies:
    get:
      description: 'Every currency with its current rate to roubles, RUB first. Open
        to everyone signed in: forms need the list.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/currency.ListCurrenciesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List currencies
      tags:
      - currencies
    post:
      consumes:
      - application/json
      description: 'The code is three Latin letters (stored upper-case), the rate
        is how many roubles one unit costs: above 0, at most 6 decimals.'
      parameters:
      - description: Currency fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/currency.CreateCurrencyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/currency.CurrencyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add a currency (admin)
      tags:
      - currencies
  /currencies/{code}:
    delete:
      description: Only a currency no subscription, request or payment uses (409 otherwise).
        RUB cannot be deleted (409).
      parameters:
      - description: Currency code, any case
        example: USD
        in: path
        name: code
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a currency (admin)
      tags:
      - currencies
    get:
      parameters:
      - description: Currency code, any case
        example: USD
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/currency.CurrencyDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a currency
      tags:
      - currencies
    patch:
      consumes:
      - application/json
      description: Rename and/or set a new rate; at least one field. The new rate
        applies at once to every report. The rate of RUB is fixed at 1 (409).
      parameters:
      - description: Currency code, any case
        example: USD
        in: path
        name: code
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
