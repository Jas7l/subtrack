  /users:
    get:
      description: 'Admin: all users. Manager: only their department (the department_id
        filter is ignored). Employee: 403. Sorted by full name.'
      parameters:
      - description: Only users of this department
        in: query
        name: department_id
        type: integer
      - description: Only this role
        enum:
        - admin
        - manager
        - employee
        in: query
        name: role
        type: string
      - description: 'true: only active, false: only blocked'
        in: query
        name: active
        type: boolean
      - description: Substring of full name or email
        in: query
        name: q
        type: string
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ListUsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: The admin sets the initial password and hands it to the person.
        The email is unique case-insensitively (409 on a clash).
      parameters:
      - description: User fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.UserDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a user (admin)
      tags:
      - users
  /users/{id}:
    get:
      description: 'Admin: any user. Manager: users of their department. Employee:
        only themselves. A user outside the caller''s view is a 404.'
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: 'Partial update; at least one field. `"is_active": false` blocks
        the user (their tokens stop working at once), `true` unblocks. `"department_id":
        null` removes them from their department. If the user headed a department
        and is blocked, demoted or moved out of it, that department is left without
        a head. Blocking also revokes all their licences. An admin cannot block themselves
        or drop their own admin role (409).'
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update a user (admin)
      tags:
      - users
  /users/{id}/password:
    put:
      consumes:
      - application/json
      description: Sets a new password, e.g. when the person forgot theirs. Issued
        tokens stay valid.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      - description: New password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.SetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Reset a user's password (admin)
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: JWT из POST /auth/login в виде «Bearer <token>».
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
